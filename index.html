<!DOCTYPE html>
<html lang="es">
<link rel="icon" type="image/jpeg" href="LOG.png" />
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gym Finity - Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="apple-touch-icon" href="img/LOGO.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap');

    body { font-family: 'Outfit', sans-serif; background-color: #020202; color: #f8fafc; overflow-x: hidden; }

    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 229, 255, 0.9)) drop-shadow(0 0 30px rgba(255, 215, 0, 0.7)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 25px rgba(0, 229, 255, 1)) drop-shadow(0 0 60px rgba(255, 215, 0, 1)); transform: scale(1.03); }
    }
    .logo-hero-glow { animation: logoPulse 3s infinite ease-in-out; }

    /* NEÓN INTENSO Y PROFUNDIDAD */

    .inner-depth {
        background: #060606;
        box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.05), inset 5px 5px 10px #020202, inset -5px -5px 10px #0a0a0a;
        border: 1px solid rgba(255, 255, 255, 0.05);
    }
  
    .btn-depth { box-shadow: 0 0 15px currentColor, 4px 4px 8px #010101, -4px -4px 8px #111; transition: all 0.2s ease; }
    .btn-depth:active { box-shadow: inset 4px 4px 8px rgba(0,0,0,0.9); transform: translateY(2px); }

    /* INPUTS BRILLANTES */
    .input-gym {
        background: #050505; border: 1px solid #27272a; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: inset 2px 2px 5px rgba(0,0,0,0.5);
    }
    .input-gym:focus {
        border-color: #00e5ff; box-shadow: 0 0 25px rgba(0,229,255,0.4), inset 2px 2px 5px rgba(0,0,0,0.5);
        outline: none; transform: translateY(-1px);
    }

    /* EFECTO DE LAS TARJETAS DE PLANES */
    .transparent-plan-card {
        transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        background: var(--plan-color-alpha) !important;
        border: 1px solid var(--plan-color) !important;
        box-shadow: 0 0 8px var(--plan-shadow) !important;
    }
    .transparent-plan-card:hover {
        transform: translateY(-12px) scale(1.03);
        box-shadow: 0 0 20px var(--plan-color), inset 0 0 10px var(--plan-shadow-inset) !important;
        background: linear-gradient(145deg, var(--plan-color-alpha) 0%, rgba(5,5,5,0.95) 100%) !important;
        z-index: 20;
    }

    /* TEXTURA METÁLICA */
    .metallic-bg {
        background-color: var(--plan-color);
        box-shadow: inset 0 0 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.4);
        position: absolute;
        inset: 0;
        z-index: -10;
    }
    .metallic-shine {
        position: absolute;
        top: -100%; left: -100%; width: 300%; height: 300%;
        background: conic-gradient(
            from 0deg,
            transparent 0deg,
            rgba(255,255,255,0.8) 45deg,
            transparent 90deg,
            transparent 180deg,
            rgba(255,255,255,0.8) 225deg,
            transparent 270deg,
            transparent 360deg
        );
        animation: spinMetalShine 5s linear infinite;
        mix-blend-mode: overlay;
    }
    .metallic-texture {
        position: absolute;
        inset: 0;
        background: repeating-radial-gradient(
            circle at 50% 50%,
            rgba(0,0,0,0.1) 0,
            rgba(0,0,0,0.1) 1px,
            transparent 1px,
            transparent 2.5px
        );
        z-index: 2;
        pointer-events: none;
        mix-blend-mode: multiply;
    }
    @keyframes spinMetalShine { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .metal-text-shadow { text-shadow: 2px 2px 4px rgba(0,0,0,0.9), 0 0 15px rgba(0,0,0,1); }

    /* ANIMACIONES GENERALES */
    @keyframes letterWave {
        0% { transform: scale(1) translateY(0); filter: brightness(1) drop-shadow(0 0 2px rgba(0,0,0,0.5)); }
        30% { transform: scale(1.25) translateY(-6px); filter: brightness(1.5) drop-shadow(0 0 25px currentColor); }
        100% { transform: scale(1) translateY(0); filter: brightness(1.2) drop-shadow(0 0 15px currentColor); }
    }
    .letter-anim { display: inline-block; animation: letterWave 1.5s both ease-in-out; transform-origin: bottom center; }
    .delay-1 { animation-delay: 0.1s; color: #FFD700; } .delay-2 { animation-delay: 0.2s; color: #FFD700; }
    .delay-3 { animation-delay: 0.3s; color: #FFD700; } .delay-4 { animation-delay: 0.4s; color: #00e5ff; }
    .delay-5 { animation-delay: 0.5s; color: #00e5ff; } .delay-6 { animation-delay: 0.6s; color: #00e5ff; }
    .delay-7 { animation-delay: 0.7s; color: #00e5ff; } .delay-8 { animation-delay: 0.8s; color: #00e5ff; }
    .delay-9 { animation-delay: 0.9s; color: #00e5ff; }

    @keyframes textGlowFlow {
        0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        50% { text-shadow: 0 0 20px rgba(255,255,255,0.9), 0 0 30px rgba(0,229,255,0.6); }
    }
    .glow-text-anim { animation: textGlowFlow 3s infinite ease-in-out; }

    /* ANIMACIÓN NEÓN DE WHATSAPP */
    @keyframes waNeon {
        0% { filter: drop-shadow(0 0 8px #25D366); color: #25D366; border-color: #25D366; background-color: rgba(37,211,102,0.15); }
        33% { filter: drop-shadow(0 0 12px #00e5ff); color: #00e5ff; border-color: #00e5ff; background-color: rgba(0,229,255,0.15); }
        66% { filter: drop-shadow(0 0 12px #FFD700); color: #FFD700; border-color: #FFD700; background-color: rgba(255,215,0,0.15); }
        100% { filter: drop-shadow(0 0 8px #25D366); color: #25D366; border-color: #25D366; background-color: rgba(37,211,102,0.15); }
    }

    /* BOTÓN WHATSAPP MÁS PEQUEÑO */
    .btn-whatsapp {
        position: fixed;
        bottom: 25px;
        right: 25px;
        z-index: 9999;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        text-decoration: none;
        border: 2px solid;
        animation: waNeon 4s infinite alternate;
        backdrop-filter: blur(8px);
        transition: transform 0.3s ease;
    }
    .btn-whatsapp:hover { transform: scale(1.15) rotate(10deg); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes scaleUp { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes slideDownPopup { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOutLoader { to { opacity: 0; visibility: hidden; z-index: -1; } }
    @keyframes floatEmpty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

    .animate-fade-in { animation: fadeIn 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .animate-scale-up { animation: scaleUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .animate-popup { animation: slideDownPopup 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .hide-loader { animation: fadeOutLoader 0.6s ease-out forwards; }
    .animate-float { animation: floatEmpty 4s ease-in-out infinite; }

    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #050505; border-radius: 10px;}
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px;}
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #00e5ff; }
    
    /* =========================================
       ANIMACIÓN LETRA POR LETRA: GYM FINITY PRO
       ========================================= */

    .logo-gym,
    .logo-finity {
        display: inline-block;
        white-space: nowrap;
    }

    .logo-letter {
        display: inline-block;
        transform-origin: center bottom;
        animation: letterWaveSlow 10s infinite ease-in-out;
        will-change: transform, filter, text-shadow;
    }

    /* GYM en dorado: cada letra se ilumina de forma progresiva */
    .logo-gym .logo-letter {
        color: #eab308;
        text-shadow: 0 0 4px rgba(234,179,8,0.2);
    }

    /* FINITY en cian: continúa la ola después de GYM */
    .logo-finity .logo-letter {
        color: #06b6d4;
        text-shadow: 0 0 4px rgba(6,182,212,0.2);
    }

    @keyframes letterWaveSlow {
        0%, 8%, 100% {
            transform: translateY(0) scale(1);
            filter: brightness(1);
            text-shadow: 0 0 3px currentColor;
        }
        3% {
            transform: translateY(-2px) scale(1.08);
            filter: brightness(1.65);
            text-shadow: 0 0 8px currentColor, 0 0 16px currentColor;
        }
    }

    /* Retrasos escalonados: la ola se repite tras terminar PRO y esperar 7 segundos (ciclo de 12 s) */
    .logo-gym .logo-letter:nth-child(1) { animation-delay: 0s; }
    .logo-gym .logo-letter:nth-child(2) { animation-delay: 0.2s; }
    .logo-gym .logo-letter:nth-child(3) { animation-delay: 0.4s; }

    .logo-finity .logo-letter:nth-child(1) { animation-delay: 0.6s; }
    .logo-finity .logo-letter:nth-child(2) { animation-delay: 0.8s; }
    .logo-finity .logo-letter:nth-child(3) { animation-delay: 1s; }
    .logo-finity .logo-letter:nth-child(4) { animation-delay: 1.2s; }
    .logo-finity .logo-letter:nth-child(5) { animation-delay: 1.4s; }
    .logo-finity .logo-letter:nth-child(6) { animation-delay: 1.6s; }

    /* Insignia PRO: pequeño zoom y destello cian */
    .logo-pro {
        color: #06b6d4;
        border: 1px solid rgba(6,182,212,0.5);
        border-radius: 9999px;
        padding: 2px 10px;
        font-size: 0.75rem;
        font-weight: 900;
        letter-spacing: 1px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background-color: transparent;
        transform-origin: center;
        animation: glow-pro 10s infinite ease-in-out;
        transition: all 0.3s ease;
        will-change: transform, box-shadow, filter;
    }

    @keyframes glow-pro {
        /* PRO empieza justo después de la ola de FINITY; ciclo total de 12 s. */
        0%, 16%, 100% {
            box-shadow: 0 0 0 rgba(0,229,255,0);
            background-color: transparent;
            color: #06b6d4;
            border-color: rgba(6,182,212,0.5);
            transform: scale(1);
            filter: brightness(1);
        }
        /* Entrada suave al zoom y al brillo, aproximadamente a los 2 segundos */
        21% {
            box-shadow: 0 0 12px rgba(0,229,255,0.7),
                        0 0 24px rgba(0,229,255,0.4),
                        inset 0 0 8px rgba(0,229,255,0.25);
            background-color: rgba(6,182,212,0.16);
            color: #ffffff;
            border-color: #06b6d4;
            transform: scale(1.05);
            filter: brightness(1.25);
        }
        /* Mantiene el zoom y el brillo durante más tiempo */
        25%, 33% {
            box-shadow: 0 0 16px rgba(0,229,255,0.85),
                        0 0 30px rgba(0,229,255,0.55),
                        inset 0 0 10px rgba(0,229,255,0.3);
            background-color: rgba(6,182,212,0.2);
            color: #ffffff;
            border-color: #06b6d4;
            transform: scale(1.09);
            filter: brightness(1.4);
        }
        /* Desciende suavemente */
        39% {
            box-shadow: 0 0 8px rgba(0,229,255,0.4);
            background-color: rgba(6,182,212,0.07);
            color: #67e8f9;
            border-color: rgba(6,182,212,0.5);
            transform: scale(1.04);
            filter: brightness(1.12);
        }
        /* PRO termina alrededor de los 5 segundos; espera 7 s antes de reiniciar */
        42% {
            box-shadow: 0 0 0 rgba(0,229,255,0);
            background-color: transparent;
            color: #06b6d4;
            border-color: rgba(6,182,212,0.5);
            transform: scale(1);
            filter: brightness(1);
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .logo-letter,
        .logo-pro {
            animation-duration: 0.01ms;
            animation-iteration-count: 1;
        }
    }

  </style>
</head>

<body class="min-h-screen flex flex-col relative">

        <!-- VISIBLE EN CELULAR Y ESCRITORIO CON TODAS SUS ANIMACIONES -->
